[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "rl-autodrive-agent"
version = "4.2.0.dev0"
description = "CPU-verifiable autonomous-driving RL research platform with real MetaDrive, PPO/MAPPO/SAC, safety supervision/distillation, semantic BEV and raw-RGB-plus-motion policies"
requires-python = ">=3.10"
dependencies = ["numpy>=1.26,<3", "torch>=2.2,<3", "PyYAML>=6,<7", "Pillow>=10", "opencv-python>=4.8", "packaging>=24"]
readme = "README.md"
license = {text = "MIT"}

[project.optional-dependencies]
metadrive = ["gymnasium>=0.29,<1.3", "metadrive-simulator==0.4.3", "panda3d>=1.10.15", "panda3d-gltf>=0.13,<1", "panda3d-simplepbr>=0.13,<1", "pygame>=2.5", "progressbar", "mediapy", "yapf", "stable-baselines3>=2.7,<3", "pettingzoo>=1.24,<2"]
experiments = ["matplotlib>=3.8", "tensorboard>=2.16"]
test = ["pytest>=8", "pytest-cov>=5", "protobuf>=4"]

[tool.setuptools.packages.find]
include = ["src", "src.*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["metadrive: real MetaDrive integration (requires optional dependencies and assets)"]
addopts = "-ra"
